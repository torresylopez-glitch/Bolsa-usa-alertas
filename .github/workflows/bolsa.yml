name: Escaner Bolsa Telegram

on:
  schedule:
    - cron: "*/30 14-19 * * 1-5"
  workflow_dispatch:

concurrency:
  group: scanner-bolsa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar escáner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Guardar estado de alertas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f alert_state.json ]; then
            git add alert_state.json

            if git diff --cached --quiet; then
              echo "No hay cambios en el estado."
            else
              git commit -m "Actualizar estado de alertas"
              git push
            fi
          else
            echo "No existe alert_state.json. No hay estado que guardar."
          fi
