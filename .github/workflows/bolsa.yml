name: Escaner Bolsa Telegram

on:
  schedule:
    # Cada 30 minutos durante la sesión
    - cron: "*/30 14-19 * * 1-5"

  workflow_dispatch:

# Evita que dos ejecuciones se pisen
# y permite que el workflow guarde el estado.
concurrency:
  group: scanner-bolsa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # DESCARGAR EL REPOSITORIO
      # ------------------------------------------

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------
      # PYTHON
      # ------------------------------------------

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------
      # DEPENDENCIAS
      # ------------------------------------------

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------
      # EJECUTAR ESCÁNER
      # ------------------------------------------

      - name: Ejecutar escáner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      # ------------------------------------------
      # GUARDAR ESTADO
      # ------------------------------------------

      - name: Guardar estado de alertas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alert_state.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el estado."
          else
            git commit -m "Actualizar estado de alertas"
            git push
          fi
